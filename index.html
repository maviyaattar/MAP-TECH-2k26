<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP-TECH 2K26 Registration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#fff;color:#333;}

/* HERO */
.hero{
  text-align:center;padding:50px 20px;
  background:#f5f8ff;border-bottom:5px solid #0D47A1;
}
.hero img{width:90px;margin-bottom:10px;}
.hero h1{font-size:32px;color:#0D47A1;}
.hero p{color:#555;}

/* FORM */
.form-section{
  max-width:650px;margin:25px auto;padding:25px;background:#fff;
  border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
.form-group{margin-bottom:15px;}
.form-group label{font-weight:600;}
.form-group input,.form-group select{
  width:100%;padding:11px;margin-top:6px;border:1px solid #ccc;border-radius:8px;
}

/* QR */
.qr{
  display:block;margin:10px auto;width:170px;
  border:4px solid #1976D2;border-radius:12px;padding:8px;
}

/* File Upload Button */
.file-btn{
  display:block;
  padding:12px;
  background:#e3f2fd;
  border:2px dashed #1976D2;
  border-radius:10px;
  text-align:center;
  color:#0D47A1;
  font-weight:600;
  cursor:pointer;
}
.file-btn input{
  display:none;
}

/* Buttons */
.pay-btn,.submit-btn{
  width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;font-size:16px;
}
.pay-btn{background:#1976D2;color:white;}
.submit-btn{background:#333;color:white;}
</style>
</head>

<body>

<section class="hero">
  <img src="logo.png">
  <h1>MAP-TECH 2K26</h1>
  <p>State Level Technical Event</p>
</section>

<section class="form-section">
  <h2 style="text-align:center;color:#0D47A1;">Registration Form</h2>
  <form id="regForm">

    <div class="form-group">
      <label>Institute Name</label>
      <input type="text" id="institute" required>
    </div>

    <div class="form-group">
      <label>Department</label>
      <select id="dept">
        <option>Computer Engineering</option>
        <option>Mechanical</option>
        <option>Electrical</option>
      </select>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" required>
    </div>

    <div class="form-group">
      <label>WhatsApp Number</label>
      <input type="tel" id="phone" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>

    <h3 style="color:#0D47A1;">Payment ₹60</h3>
    <img src="scanner.png" class="qr">

    <button type="button" class="pay-btn" onclick="payNow()">Pay via UPI</button>

    <div class="form-group">
      <label>Upload Payment Screenshot</label>
      <label class="file-btn">
        Select Screenshot
        <input type="file" id="screenshot" accept="image/*" required>
      </label>
    </div>

    <button type="submit" class="submit-btn">Submit Registration</button>
  </form>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjDdnn_0_K0iQkSCLd5RcgMrP-DOjrzzU",
  authDomain: "map-tech2k26.firebaseapp.com",
  projectId: "map-tech2k26"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.payNow = () => {
  window.location.href="upi://pay?pa=meraj.pathan1@ibl&pn=MAPTECH2K26&am=60&cu=INR";
};

document.getElementById("regForm").addEventListener("submit", async e=>{
  e.preventDefault();

  const institute = document.getElementById("institute").value;
  const dept = document.getElementById("dept").value;
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const screenshotInput = document.getElementById("screenshot");

  if(!screenshotInput.files[0]){
    alert("Please upload screenshot");
    return;
  }

  const file = screenshotInput.files[0];
  const data = new FormData();
  data.append("file", file);
  data.append("upload_preset", "maptech_preset");

  const res = await fetch("https://api.cloudinary.com/v1_1/dgt4rfzqb/image/upload",{
    method:"POST",
    body:data
  });

  const result = await res.json();

  await addDoc(collection(db,"registrations"),{
    institute, dept, name, phone, email,
    screenshot: result.secure_url
  });

  alert("Registration Successful 🎉");
  regForm.reset();
});
</script>

</body>
</html>
