<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - MAP-TECH 2K26</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
:root {
  --primary-color: #0D47A1;
  --secondary-color: #1976D2;
  --success-color: #4CAF50;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
}

/* Loading Spinner */
.loader-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.loader-content {
  display: flex;
  align-items: center;
  margin-bottom: 15px;
}

.loader {
  width: 50px;
  height: 50px;
  border: 5px solid #f3f3f3;
  border-top: 5px solid var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loader-text {
  margin-left: 20px;
  font-size: 18px;
  color: var(--primary-color);
  font-weight: 600;
}

.loader-branding {
  font-size: 12px;
  color: #666;
  font-style: italic;
  animation: fadeIn 1s ease-in;
}

.loader-branding i {
  color: var(--secondary-color);
  margin-right: 5px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.header {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 30px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.header h1 {
  font-family: 'Orbitron', sans-serif;
  color: var(--primary-color);
  font-size: 28px;
}

.stats {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.stat-item {
  background: linear-gradient(135deg, var(--secondary-color), #42A5F5);
  color: white;
  padding: 15px 25px;
  border-radius: 10px;
  text-align: center;
}

.stat-number {
  font-size: 24px;
  font-weight: 700;
}

.stat-label {
  font-size: 12px;
  opacity: 0.9;
}

.filters {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
}

.filters input, .filters select {
  padding: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  flex: 1;
  min-width: 200px;
  font-family: 'Poppins', sans-serif;
}

.filters button {
  padding: 10px 20px;
  background: var(--primary-color);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
}

.filters button:hover {
  background: var(--secondary-color);
  transform: translateY(-2px);
}

.cards-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.registration-card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
  transition: all 0.3s ease;
  animation: fadeIn 0.5s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.registration-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding-bottom: 15px;
  border-bottom: 2px solid #f0f0f0;
}

.card-id {
  font-family: 'Orbitron', sans-serif;
  color: var(--primary-color);
  font-weight: 700;
  font-size: 14px;
}

.card-timestamp {
  font-size: 12px;
  color: #666;
}

.card-body {
  margin-bottom: 15px;
}

.card-field {
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.card-field i {
  color: var(--secondary-color);
  width: 20px;
  margin-top: 3px;
}

.field-label {
  font-weight: 600;
  color: #333;
  min-width: 100px;
}

.field-value {
  color: #666;
  flex: 1;
}

.event-badge {
  display: inline-block;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.card-footer {
  display: flex;
  gap: 10px;
  padding-top: 15px;
  border-top: 2px solid #f0f0f0;
}

.card-btn {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  font-size: 13px;
}

.btn-view {
  background: #e3f2fd;
  color: var(--primary-color);
}

.btn-view:hover {
  background: var(--secondary-color);
  color: white;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

.empty-state i {
  font-size: 80px;
  color: #ddd;
  margin-bottom: 20px;
}

.empty-state h3 {
  color: #666;
  margin-bottom: 10px;
}

@media (max-width: 768px) {
  .header {
    flex-direction: column;
    text-align: center;
  }
  
  .cards-container {
    grid-template-columns: 1fr;
  }
  
  .filters {
    flex-direction: column;
  }
  
  .filters input, .filters select {
    width: 100%;
  }
}
</style>
</head>

<body>

<!-- Loading Overlay -->
<div class="loader-overlay" id="loader">
  <div class="loader-content">
    <div class="loader"></div>
    <div class="loader-text">Loading Registrations...</div>
  </div>
  <div class="loader-branding"><i class="fas fa-code"></i>Crafted by Maviya Attar</div>
</div>

<div class="header">
  <h1><i class="fas fa-user-shield"></i> Admin Dashboard</h1>
  <div class="stats">
    <div class="stat-item">
      <div class="stat-number" id="totalCount">0</div>
      <div class="stat-label">Total Registrations</div>
    </div>
    <div class="stat-item" style="background: linear-gradient(135deg, #ffc107, #ff9800);">
      <div class="stat-number" id="pendingCount">0</div>
      <div class="stat-label">Pending Verification</div>
    </div>
    <div class="stat-item" style="background: linear-gradient(135deg, #4CAF50, #66BB6A);">
      <div class="stat-number" id="verifiedCount">0</div>
      <div class="stat-label">Verified</div>
    </div>
  </div>
</div>

<div class="filters">
  <input type="text" id="searchInput" placeholder="Search by name, institute, or email...">
  <select id="eventFilter">
    <option value="">All Events</option>
    <option value="Web Development Workshop">Web Development Workshop</option>
    <option value="AI/ML Seminar">AI/ML Seminar</option>
    <option value="Robotics Competition">Robotics Competition</option>
    <option value="Hackathon">Hackathon</option>
    <option value="Tech Quiz">Tech Quiz</option>
  </select>
  <select id="deptFilter">
    <option value="">All Departments</option>
    <option value="Computer Engineering">Computer Engineering</option>
    <option value="Mechanical Engineering">Mechanical Engineering</option>
    <option value="Electrical Engineering">Electrical Engineering</option>
    <option value="Electronics & Telecommunication Engineering">Electronics & Telecommunication Engineering</option>
    <option value="Other (Diploma Course)">Other (Diploma Course)</option>
  </select>
  <button onclick="applyFilters()"><i class="fas fa-filter"></i> Filter</button>
  <button onclick="exportData()"><i class="fas fa-download"></i> Export CSV</button>
</div>

<div class="cards-container" id="cardsContainer">
  <!-- Registration cards will be loaded here -->
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjDdnn_0_K0iQkSCLd5RcgMrP-DOjrzzU",
  authDomain: "map-tech2k26.firebaseapp.com",
  projectId: "map-tech2k26"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allRegistrations = [];
let filteredRegistrations = [];

// Load registrations
async function loadRegistrations() {
  const loader = document.getElementById('loader');
  loader.style.display = 'flex';
  
  try {
    const q = query(collection(db, "registrations"), orderBy("timestamp", "desc"));
    const querySnapshot = await getDocs(q);
    
    allRegistrations = [];
    querySnapshot.forEach((doc) => {
      allRegistrations.push({ id: doc.id, ...doc.data() });
    });
    
    filteredRegistrations = [...allRegistrations];
    displayRegistrations();
    updateStats();
  } catch (error) {
    console.error("Error loading registrations:", error);
    document.getElementById('cardsContainer').innerHTML = `
      <div class="empty-state">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Error Loading Data</h3>
        <p>Unable to load registrations. Please check console for details.</p>
      </div>
    `;
  } finally {
    loader.style.display = 'none';
  }
}

// Display registrations as cards
function displayRegistrations() {
  const container = document.getElementById('cardsContainer');
  
  if (filteredRegistrations.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-inbox"></i>
        <h3>No Registrations Found</h3>
        <p>No registrations match your filters.</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = filteredRegistrations.map(reg => {
    const date = reg.timestamp ? new Date(reg.timestamp).toLocaleString() : 'N/A';
    return `
      <div class="registration-card">
        <div class="card-header">
          <div class="card-id">#${reg.id.substring(0, 8).toUpperCase()}</div>
          <div class="card-timestamp">${date}</div>
        </div>
        
        <div class="card-body">
          <div class="card-field">
            <i class="fas fa-user"></i>
            <div>
              <div class="field-label">Name</div>
              <div class="field-value">${reg.name || 'N/A'}</div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-university"></i>
            <div>
              <div class="field-label">Institute</div>
              <div class="field-value">${reg.institute || 'N/A'}</div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-graduation-cap"></i>
            <div>
              <div class="field-label">Department</div>
              <div class="field-value">${reg.dept || 'N/A'}</div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-calendar-alt"></i>
            <div>
              <div class="field-label">Event</div>
              <div class="field-value"><span class="event-badge">${reg.event || 'N/A'}</span></div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-phone"></i>
            <div>
              <div class="field-label">WhatsApp</div>
              <div class="field-value">${reg.phone || 'N/A'}</div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-envelope"></i>
            <div>
              <div class="field-label">Email</div>
              <div class="field-value">${reg.email || 'N/A'}</div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-image"></i>
            <div>
              <div class="field-label">Payment Screenshot</div>
              <div class="field-value">
                ${reg.paymentScreenshot ? '<button class="card-btn btn-view" onclick="viewScreenshot(\'' + reg.id + '\')">View Screenshot</button>' : 'Not uploaded'}
              </div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-hourglass-half"></i>
            <div>
              <div class="field-label">Verification Status</div>
              <div class="field-value">
                <span style="padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; ${
                  reg.verificationStatus === 'verified' ? 'background: #d4edda; color: #155724;' :
                  reg.verificationStatus === 'rejected' ? 'background: #f8d7da; color: #721c24;' :
                  'background: #fff3cd; color: #856404;'
                }">
                  ${reg.verificationStatus === 'verified' ? '✓ Verified' : 
                    reg.verificationStatus === 'rejected' ? '✗ Rejected' : 
                    '⏳ Pending'}
                </span>
              </div>
            </div>
          </div>
          
          <div class="card-field">
            <i class="fas fa-credit-card"></i>
            <div>
              <div class="field-label">Payment Status</div>
              <div class="field-value">${reg.paymentStatus || 'pending_verification'}</div>
            </div>
          </div>
        </div>
        
        <div class="card-footer">
          ${reg.verificationStatus === 'pending' ? `
            <button class="card-btn" style="background: #4CAF50; color: white;" onclick="updateVerificationStatus('${reg.id}', 'verified')">
              <i class="fas fa-check"></i> Verify
            </button>
            <button class="card-btn" style="background: #f44336; color: white;" onclick="updateVerificationStatus('${reg.id}', 'rejected')">
              <i class="fas fa-times"></i> Reject
            </button>
          ` : `
            <div style="color: ${reg.verificationStatus === 'verified' ? '#4CAF50' : '#f44336'}; font-weight: 600; text-align: center; padding: 10px;">
              <i class="fas fa-${reg.verificationStatus === 'verified' ? 'check-circle' : 'times-circle'}"></i> 
              ${reg.verificationStatus === 'verified' ? 'Verified' : 'Rejected'}
            </div>
          `}
        </div>
      </div>
    `;
  }).join('');
}

// Update statistics
function updateStats() {
  document.getElementById('totalCount').textContent = allRegistrations.length;
  
  const pendingCount = allRegistrations.filter(reg => 
    reg.verificationStatus === 'pending' || !reg.verificationStatus
  ).length;
  document.getElementById('pendingCount').textContent = pendingCount;
  
  const verifiedCount = allRegistrations.filter(reg => 
    reg.verificationStatus === 'verified'
  ).length;
  document.getElementById('verifiedCount').textContent = verifiedCount;
}

// Apply filters
window.applyFilters = function() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const eventFilter = document.getElementById('eventFilter').value;
  const deptFilter = document.getElementById('deptFilter').value;
  
  filteredRegistrations = allRegistrations.filter(reg => {
    const matchesSearch = !searchTerm || 
      (reg.name && reg.name.toLowerCase().includes(searchTerm)) ||
      (reg.institute && reg.institute.toLowerCase().includes(searchTerm)) ||
      (reg.email && reg.email.toLowerCase().includes(searchTerm));
    
    const matchesEvent = !eventFilter || reg.event === eventFilter;
    const matchesDept = !deptFilter || reg.dept === deptFilter;
    
    return matchesSearch && matchesEvent && matchesDept;
  });
  
  displayRegistrations();
};

// Export to CSV
window.exportData = function() {
  if (filteredRegistrations.length === 0) {
    alert('No data to export');
    return;
  }
  
  const headers = ['Name', 'Institute', 'Department', 'Event', 'Phone', 'Email', 'Verification Status', 'Payment Status', 'Registration Date'];
  const rows = filteredRegistrations.map(reg => [
    reg.name || '',
    reg.institute || '',
    reg.dept || '',
    reg.event || '',
    reg.phone || '',
    reg.email || '',
    reg.verificationStatus || 'pending',
    reg.paymentStatus || 'pending_verification',
    reg.timestamp ? new Date(reg.timestamp).toLocaleString() : ''
  ]);
  
  let csv = headers.join(',') + '\n';
  rows.forEach(row => {
    csv += row.map(field => `"${field}"`).join(',') + '\n';
  });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MAP-TECH-2K26-Registrations-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  window.URL.revokeObjectURL(url);
};

// View payment screenshot
window.viewScreenshot = function(registrationId) {
  const reg = allRegistrations.find(r => r.id === registrationId);
  if (reg && reg.paymentScreenshot) {
    // Create modal to display screenshot
    const modal = document.createElement('div');
    modal.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 20px;
    `;
    
    const content = document.createElement('div');
    content.style.cssText = `
      position: relative;
      max-width: 90%;
      max-height: 90%;
      background: white;
      border-radius: 12px;
      padding: 20px;
      overflow: auto;
    `;
    
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '✕ Close';
    closeBtn.style.cssText = `
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 10px 20px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      z-index: 1;
    `;
    closeBtn.onclick = () => modal.remove();
    
    const img = document.createElement('img');
    img.src = reg.paymentScreenshot;
    img.style.cssText = `
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      display: block;
      margin-top: 40px;
    `;
    
    const info = document.createElement('div');
    info.style.cssText = `
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    `;
    info.innerHTML = `
      <strong>Registration Details:</strong><br>
      Name: ${reg.name}<br>
      Phone: ${reg.phone}<br>
      Amount: ₹${reg.paymentAmount || '60'}
    `;
    
    content.appendChild(closeBtn);
    content.appendChild(img);
    content.appendChild(info);
    modal.appendChild(content);
    document.body.appendChild(modal);
    
    // Close on background click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.remove();
      }
    });
  } else {
    alert('Screenshot not available');
  }
};

// Update verification status
window.updateVerificationStatus = async function(registrationId, status) {
  if (!confirm(`Are you sure you want to ${status} this registration?`)) {
    return;
  }
  
  const loader = document.getElementById('loader');
  loader.style.display = 'flex';
  
  try {
    const docRef = doc(db, 'registrations', registrationId);
    await updateDoc(docRef, {
      verificationStatus: status,
      paymentStatus: status === 'verified' ? 'verified' : 'rejected',
      verifiedAt: new Date().toISOString()
    });
    
    alert(`Registration ${status} successfully!`);
    loadRegistrations();
  } catch (error) {
    console.error('Error updating verification status:', error);
    alert('Failed to update verification status. Please try again.');
  } finally {
    loader.style.display = 'none';
  }
};

// Real-time search
document.getElementById('searchInput').addEventListener('input', applyFilters);

// Load on page load
loadRegistrations();
</script>

</body>
</html>
