<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - MAP-TECH 2K26</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
:root {
  --primary-color: #0D47A1;
  --secondary-color: #1976D2;
  --success-color: #4CAF50;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  min-height: 100vh;
  background-repeat: no-repeat
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
  animation: rotate 20s linear infinite;
  will-change: transform;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.container {
  background: rgba(255, 255, 255, 0.98);
  padding: 50px 40px;
  border-radius: 24px;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3),
              0 10px 40px rgba(118, 75, 162, 0.2);
  text-align: center;
  max-width: 650px;
  width: 100%;
  animation: slideUp 0.6s ease-out;
  position: relative;
  z-index: 1;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.success-icon {
  width: 100px;
  height: 100px;
  background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 25px;
  animation: scaleIn 0.5s ease-out 0.3s both;
  box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4),
              0 0 0 10px rgba(76, 175, 80, 0.1),
              0 0 0 20px rgba(76, 175, 80, 0.05);
  position: relative;
}

.success-icon::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: inherit;
  animation: pulse 2s ease-out infinite;
  z-index: -1;
}

@keyframes scaleIn {
  from {
    transform: scale(0);
  }
  to {
    transform: scale(1);
  }
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0.5;
  }
  50% {
    transform: scale(1.1);
    opacity: 0;
  }
}

.success-icon i {
  font-size: 50px;
  color: white;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 42px;
  color: var(--primary-color);
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 15px;
  animation: fadeIn 0.6s ease-out 0.4s both;
  letter-spacing: 1px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.subtitle {
  font-size: 19px;
  color: #666;
  margin-bottom: 35px;
  animation: fadeIn 0.6s ease-out 0.5s both;
  font-weight: 400;
  line-height: 1.6;
}

.details {
  background: linear-gradient(135deg, #f5f8ff 0%, #e8f0fe 100%);
  padding: 30px;
  border-radius: 16px;
  margin: 25px 0;
  text-align: left;
  animation: fadeIn 0.6s ease-out 0.6s both;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
  border: 1px solid rgba(25, 118, 210, 0.1);
}

.detail-item {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  transition: all 0.2s ease;
}

.detail-item:hover {
  background: rgba(255, 255, 255, 0.5);
  border-radius: 6px;
  margin: 0 -10px;
  padding-left: 15px;
  padding-right: 15px;
}

.detail-item:last-child {
  border-bottom: none;
}

.detail-label {
  font-weight: 600;
  color: var(--primary-color);
  font-size: 15px;
}

.detail-value {
  color: #333;
  font-size: 15px;
  font-weight: 500;
}

.message-box {
  background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
  padding: 22px;
  border-radius: 12px;
  margin: 25px 0;
  border-left: 5px solid var(--success-color);
  animation: fadeIn 0.6s ease-out 0.7s both;
  box-shadow: 0 4px 12px rgba(76, 175, 80, 0.15);
}

.message-box i {
  color: var(--success-color);
  margin-right: 10px;
}

.message-box p {
  color: #1b5e20;
  line-height: 1.7;
  font-size: 15px;
}

.button-group {
  display: flex;
  gap: 15px;
  margin-top: 30px;
  flex-wrap: wrap;
  animation: fadeIn 0.6s ease-out 0.8s both;
}

.btn {
  flex: 1;
  padding: 16px 32px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 160px;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.btn:hover::before {
  width: 300px;
  height: 300px;
}

.btn-primary {
  background: linear-gradient(135deg, #1976D2 0%, #42A5F5 100%);
  color: white;
  box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(25, 118, 210, 0.5);
}

.btn-secondary {
  background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
  color: #333;
  border: 2px solid #d0d0d0;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.btn-secondary:hover {
  background: linear-gradient(135deg, #e0e0e0 0%, #d0d0d0 100%);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  background: #ffd700;
  animation: confetti-fall 3s ease-out forwards;
}

@keyframes confetti-fall {
  0% {
    transform: translateY(-100vh) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

@media (max-width: 768px) {
  .container {
    padding: 40px 25px;
  }
  
  h1 {
    font-size: 32px;
  }

  .success-icon {
    width: 80px;
    height: 80px;
  }

  .success-icon i {
    font-size: 40px;
  }
  
  .button-group {
    flex-direction: column;
  }
  
  .btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  h1 {
    font-size: 28px;
  }

  .subtitle {
    font-size: 16px;
  }

  .container {
    padding: 30px 20px;
  }

  .details {
    padding: 20px;
  }

  .detail-item {
    flex-direction: column;
    gap: 5px;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="success-icon">
    <i class="fas fa-check"></i>
  </div>
  
  <h1>Thank You!</h1>
  <p class="subtitle">Your registration has been submitted successfully</p>
  
  <div class="details" id="detailsSection">
    <!-- Registration details will be loaded here -->
  </div>
  
  <div class="message-box">
    <p>
      <i class="fas fa-info-circle"></i>
      Your registration has been recorded successfully. Please save your confirmation details for future reference.
    </p>
  </div>
  
  <div class="button-group">
    <a href="confirmation.html" class="btn btn-primary">
      <i class="fas fa-file-alt"></i> View Confirmation
    </a>
    <a href="index.html" class="btn btn-secondary">
      <i class="fas fa-home"></i> Back to Home
    </a>
  </div>
</div>



<script>
// Create confetti effect
function createConfetti() {
  const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24'];
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = Math.random() * 2 + 's';
      document.body.appendChild(confetti);
      
      setTimeout(() => confetti.remove(), 3000);
    }, i * 30);
  }
}

// Load registration data
window.addEventListener('load', () => {
  const data = sessionStorage.getItem('registrationData');
  const detailsSection = document.getElementById('detailsSection');
  
  if (data) {
    const regData = JSON.parse(data);
    
    // Create elements safely using textContent to prevent XSS
    const createDetailItem = (label, value) => {
      const div = document.createElement('div');
      div.className = 'detail-item';
      
      const labelSpan = document.createElement('span');
      labelSpan.className = 'detail-label';
      labelSpan.textContent = label + ':';
      
      const valueSpan = document.createElement('span');
      valueSpan.className = 'detail-value';
      valueSpan.textContent = value;
      
      div.appendChild(labelSpan);
      div.appendChild(valueSpan);
      return div;
    };
    
    detailsSection.innerHTML = ''; // Clear skeleton
    detailsSection.appendChild(createDetailItem('Institute', regData.institute || 'N/A'));
    detailsSection.appendChild(createDetailItem('Department', regData.dept || 'N/A'));
    detailsSection.appendChild(createDetailItem('Name', regData.name || 'N/A'));
    detailsSection.appendChild(createDetailItem('WhatsApp', regData.phone || 'N/A'));
    detailsSection.appendChild(createDetailItem('Email', regData.email || 'N/A'));
    detailsSection.appendChild(createDetailItem('Event', regData.event || 'N/A'));
  } else {
    const p = document.createElement('p');
    p.style.textAlign = 'center';
    p.style.color = '#666';
    p.textContent = 'Registration details not available. Please refer to your confirmation page.';
    detailsSection.innerHTML = '';
    detailsSection.appendChild(p);
  }
  
  // Trigger confetti
  createConfetti();
});
</script>

</body>
</html>
